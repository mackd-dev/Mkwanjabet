services:
  postgres:
    image: postgres:16-alpine
    container_name: primeodds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: primeodds
      POSTGRES_USER: primeodds
      POSTGRES_PASSWORD: primeodds_dev_password
    ports:
      - "5434:5432"
    volumes:
      - primeodds_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primeodds -d primeodds"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  primeodds_postgres_data:
