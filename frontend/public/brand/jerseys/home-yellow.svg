           Q 491.99999999999994,691.1999999999999 491.99999999999994,662.4
           L 491.99999999999994,446.4
           Q 540.0,360.0 540.0,259.2
           Q 540.0,158.4 468.0,72.0
           L 372.0,36.0
           Q 300.0,86.39999999999999 228.0,36.0 Z"
        fill="url(#shade_home)" stroke="#111111" stroke-width="3"/>
  <!-- collar -->
